[program:mailforge-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/mailforge/artisan queue:work --sleep=1 --tries=3 --timeout=120 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/mailforge/storage/logs/worker.log
stopwaitsecs=3600
